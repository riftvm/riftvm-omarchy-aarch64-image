PACKAGE_NAME="riftvm-virtio-snd"
PACKAGE_VERSION="7.2.6"

BUILT_MODULE_NAME[0]="virtio_snd"
DEST_MODULE_LOCATION[0]="/kernel/sound/virtio"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# Rebuild for a kernel installed later. Without this the module disappears the
# first time omarchy-update pulls a new kernel, and the machine loses sound
# with nothing to point at.
AUTOINSTALL="yes"
