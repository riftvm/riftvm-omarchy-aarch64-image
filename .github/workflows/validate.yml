name: Image contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned upstream revision
        id: upstream
        run: |
          source sources.env
          echo "ref=$OMARCHY_AARCH64_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: riverscn/omarchy-aarch64
          ref: ${{ steps.upstream.outputs.ref }}
          path: build/test-upstream
          persist-credentials: false
      - name: Check image, provisioning, packaging, and display contracts
        env:
          OMARCHY_TEST_SOURCE: build/test-upstream
        run: ./tests/run
