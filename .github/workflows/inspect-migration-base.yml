name: Inspect pinned migration base
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the reviewed factory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/base-release
          gh release download v4.0.0-alpha-ezvm.32 --repo everettjf/omarchy-aarch64-image --dir build/base-release \
            --pattern ezvm-release-manifest.json --pattern 'Omarchy-ezvm.sparse.gz.part-*' \
            --pattern '*.packages.tsv' --pattern '*.all-packages.txt' --pattern '*.explicit-packages.txt'
          ./bin/reconstruct-riftvm-release --legacy-ezvm32 --assets build/base-release --output build/base.raw \
            --tag v4.0.0-alpha-ezvm.32 --sha256 1ad443730ea340eaa7003b01c26ea142434b0f88a4280bd34fb8909e32d9b0a9
      - name: Inventory factory integration without modifying it
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
          loop=$(sudo losetup --find --show --partscan build/base.raw)
          mkdir -p build/base-root
          trap 'sudo umount build/base-root; sudo losetup -d "$loop"' EXIT
          sudo mount -o ro,subvol=@ "${loop}p2" build/base-root
          sudo find build/base-root -iname '*ezvm*' -printf '%y %p -> %l\n' | sort >build/migration-paths.txt
          sudo grep -rlI -E 'ezvm|EZVM' build/base-root/etc build/base-root/usr/local build/base-root/usr/bin build/base-root/usr/share/omarchy-aarch64 build/base-root/opt >build/migration-text-paths.txt || test "$?" = 1
          sudo cat build/base-root/usr/share/omarchy-aarch64/image-build.txt >build/base-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: migration-inventory
          path: |
            build/migration-paths.txt
            build/migration-text-paths.txt
            build/base-provenance.txt
