name: Check official Omarchy release

on:
  # Manual only: run it when the pinned Omarchy version is being reviewed.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare-stable-release:
    if: github.repository == 'riftvm/riftvm-omarchy-aarch64-image'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout image source
        uses: actions/checkout@v7

      - name: Compare pinned and official stable versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source ./sources.env
          official_tag=$(gh api repos/omacom/omarchy/releases/latest --jq .tag_name)
          official_version=${official_tag#v}
          if [[ "$official_version" == "$OMARCHY_AARCH64_VERSION" ]]; then
            echo "Factory source already tracks official Omarchy $official_tag."
            exit 0
          fi
          arm_port_status="Review the signed official AArch64 packages at https://pkgs.omarchy.org/stable/aarch64/, pin the release commit, and run the complete native VM acceptance gates before changing the Factory pin."
          {
            echo "## Omarchy update available"
            echo "Official: ${official_tag}; factory source: ${OMARCHY_AARCH64_VERSION}."
            echo "$arm_port_status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues) != true ]]; then
            echo "::notice::Issues are disabled; the update is recorded in the job summary."
            exit 0
          fi
          title="Track official Omarchy ${official_tag} in the RiftVM factory image"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq length)
          [[ "$existing" == 0 ]] || exit 0
          gh issue create --title "$title" --body "Official Omarchy released **${official_tag}**, while the RiftVM AArch64 factory is pinned to **${OMARCHY_AARCH64_VERSION}** at \`${OMARCHY_AARCH64_REF}\`.

          ${arm_port_status}

          Port and review the AArch64 release, update immutable source/package refs, build a draft Factory image, and pass clean-workspace, input, display, sharing, update, and rollback acceptance before promotion.

          Official release: https://github.com/omacom/omarchy/releases/tag/${official_tag}
          AArch64 packages: https://pkgs.omarchy.org/stable/aarch64/"
