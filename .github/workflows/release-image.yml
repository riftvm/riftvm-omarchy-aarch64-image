name: Build AArch64 RiftVM image candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate tag to create (for example v0.1.0-rc.1)
        required: true
        type: string
      migrate_ezvm32:
        description: Migrate the digest-pinned reviewed EZVM .32 factory into RiftVM
        required: false
        default: false
        type: boolean
      base_release_tag:
        description: Optional verified release to rebake when only RiftVM integration changed
        required: false
        type: string
      base_image_sha256:
        description: Required complete raw SHA-256 when base_release_tag is set
        required: false
        type: string

concurrency:
  group: aarch64-image-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.repository == 'riftvm/riftvm-omarchy-aarch64-image'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout image source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag=$REQUESTED_TAG
          else
            tag=$REF_NAME
          fi
          [[ $tag =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Resolve pinned build inputs
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          source ./sources.env
          echo "omarchy_url=$OMARCHY_AARCH64_URL" >> "$GITHUB_OUTPUT"
          echo "omarchy_ref=$OMARCHY_AARCH64_REF" >> "$GITHUB_OUTPUT"
          echo "packages_url=$OMARCHY_PKGS_AARCH64_URL" >> "$GITHUB_OUTPUT"
          echo "packages_ref=$OMARCHY_PKGS_AARCH64_REF" >> "$GITHUB_OUTPUT"
          echo "riftvm_agent_url=$RIFTVM_GUEST_AGENT_URL" >> "$GITHUB_OUTPUT"
          echo "riftvm_agent_ref=$RIFTVM_GUEST_AGENT_REF" >> "$GITHUB_OUTPUT"
          wl_clipboard_rs_repository=${WL_CLIPBOARD_RS_URL#https://github.com/}
          wl_clipboard_rs_repository=${wl_clipboard_rs_repository%.git}
          echo "wl_clipboard_rs_repository=$wl_clipboard_rs_repository" >> "$GITHUB_OUTPUT"
          echo "wl_clipboard_rs_ref=$WL_CLIPBOARD_RS_REF" >> "$GITHUB_OUTPUT"
          echo "cache_week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Resolve optional integration-only base
        id: base
        env:
          MIGRATE_EZVM32: ${{ inputs.migrate_ezvm32 }}
          BASE_RELEASE_TAG: ${{ inputs.base_release_tag }}
          BASE_IMAGE_SHA256: ${{ inputs.base_image_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$MIGRATE_EZVM32" == true ]]; then
            [[ -z "$BASE_RELEASE_TAG" && -z "$BASE_IMAGE_SHA256" ]] || { echo 'Do not combine legacy migration and another base.' >&2; exit 1; }
            echo 'use_rebake=true' >> "$GITHUB_OUTPUT"
            echo 'legacy=true' >> "$GITHUB_OUTPUT"
            echo 'tag=v4.0.0-alpha-ezvm.32' >> "$GITHUB_OUTPUT"
            echo 'sha256=1ad443730ea340eaa7003b01c26ea142434b0f88a4280bd34fb8909e32d9b0a9' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_RELEASE_TAG" && -z "$BASE_IMAGE_SHA256" ]]; then
            echo 'use_rebake=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $BASE_RELEASE_TAG =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo 'A valid base_release_tag is required when rebaking.' >&2
            exit 1
          }
          [[ $BASE_IMAGE_SHA256 =~ ^[0-9a-f]{64}$ ]] || {
            echo 'A complete lowercase base_image_sha256 is required when rebaking.' >&2
            exit 1
          }
          echo 'use_rebake=true' >> "$GITHUB_OUTPUT"
          echo "tag=$BASE_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$BASE_IMAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Omarchy source
        uses: actions/checkout@v7
        with:
          repository: riverscn/omarchy-aarch64
          ref: ${{ steps.sources.outputs.omarchy_ref }}
          path: build/dependencies/omarchy-aarch64
          persist-credentials: false

      - name: Checkout pinned native builder source
        uses: actions/checkout@v7
        with:
          repository: riverscn/omarchy-pkgs-aarch64
          ref: ${{ steps.sources.outputs.packages_ref }}
          path: build/dependencies/omarchy-pkgs-aarch64
          persist-credentials: false

      - name: Checkout pinned RiftVM guest-agent source
        uses: actions/checkout@v7
        with:
          repository: riftvm/riftvm
          ref: ${{ steps.sources.outputs.riftvm_agent_ref }}
          path: build/dependencies/riftvm
          persist-credentials: false

      - name: Checkout pinned Wayland clipboard frontend
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.wl_clipboard_rs_repository }}
          ref: ${{ steps.sources.outputs.wl_clipboard_rs_ref }}
          path: build/dependencies/wl-clipboard-rs
          persist-credentials: false

      - name: Build pinned RiftVM guest agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dependencies/rift-agent
          (
            cd build/dependencies/riftvm/GuestAgent/linux
            go test ./...
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${{ steps.sources.outputs.riftvm_agent_ref }}" \
              -o ../../../rift-agent/rift-agent .
          )
          file build/dependencies/rift-agent/rift-agent |
            grep -q 'ELF 64-bit.*ARM aarch64.*statically linked'

      - name: Build pinned Wayland clipboard frontend
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path build/dependencies/wl-clipboard-rs/Cargo.toml \
            --package wl-clipboard-rs-tools --bin wl-copy
          install -Dm755 \
            build/dependencies/wl-clipboard-rs/target/release/wl-copy \
            build/dependencies/rift-agent/wl-copy
          file build/dependencies/rift-agent/wl-copy |
            grep -q 'ELF 64-bit.*ARM aarch64'

      - name: Restore verified rolling inputs
        id: input-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/cache/ArchLinuxARM-aarch64-latest.tar.gz
            build/cache/ArchLinuxARM-aarch64-latest.tar.gz.sig
            build/cache/archlinuxarm.gpg
            build/cache/archlinuxarm-rootfs-*.gpg
            build/cache/node-SHASUMS256.txt
            build/cache/node-v*-linux-arm64.tar.gz
          key: image-inputs-${{ runner.arch }}-${{ hashFiles('sources.env') }}-${{ steps.sources.outputs.cache_week }}

      - name: Reclaim hosted-runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/ghc
          docker system prune --all --force --volumes
          sudo apt-get update
          df -h /

      - name: Set up native Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Arch Linux ARM image environment
        uses: docker/build-push-action@v7
        with:
          context: build/dependencies/omarchy-pkgs-aarch64/build
          platforms: linux/arm64
          target: builder
          tags: omarchy-pkg-builder:latest-aarch64-edge
          load: true
          cache-from: type=gha,scope=omarchy-aarch64-image-builder
          cache-to: type=gha,scope=omarchy-aarch64-image-builder,mode=max

      - name: Run release contracts
        env:
          OMARCHY_TEST_SOURCE: build/dependencies/omarchy-aarch64
        run: ./tests/run

      - name: Reconstruct and verify pinned base release
        if: steps.base.outputs.use_rebake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE_TAG: ${{ steps.base.outputs.tag }}
          BASE_IMAGE_SHA256: ${{ steps.base.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build/base-release
          legacy_args=()
          if [[ '${{ steps.base.outputs.legacy }}' == true ]]; then
            gh release download "$BASE_RELEASE_TAG" --repo everettjf/omarchy-aarch64-image --dir build/base-release \
              --pattern ezvm-release-manifest.json --pattern image-provenance.txt --pattern 'Omarchy-ezvm.sparse.gz.part-*' \
              --pattern '*.packages.tsv' --pattern '*.all-packages.txt' --pattern '*.explicit-packages.txt'
            legacy_args=(--legacy-ezvm32)
          else
            gh release download "$BASE_RELEASE_TAG" --dir build/base-release
          fi
          ./bin/reconstruct-riftvm-release "${legacy_args[@]}" \
            --assets build/base-release \
            --output build/base.raw \
            --tag "$BASE_RELEASE_TAG" \
            --sha256 "$BASE_IMAGE_SHA256"

      - name: Prove integration-only change scope
        if: steps.base.outputs.use_rebake == 'true' && steps.base.outputs.legacy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RELEASE_TAG: ${{ steps.base.outputs.tag }}
          OMARCHY_REF: ${{ steps.sources.outputs.omarchy_ref }}
          WL_COPY_REF: ${{ steps.sources.outputs.wl_clipboard_rs_ref }}
        run: |
          set -euo pipefail
          target=$(gh release view "$BASE_RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
          base_commit=$(git rev-parse "$target^{commit}")
          git merge-base --is-ancestor "$base_commit" HEAD || {
            echo 'The base Release does not belong to the current source history.' >&2
            exit 1
          }
          while IFS= read -r path; do
            case "$path" in
              sources.env | bin/build-image | bin/reconstruct-riftvm-release | \
                bin/rebake-riftvm-integration | bin/rebake-riftvm-integration-container | \
                .github/workflows/release-image.yml | README.md | RELEASE_NOTES.md | \
                profiles/aarch64-virt/overlay/etc/systemd/user/rift-session-agent.service | \
                docs/* | tests/*) ;;
              *)
                echo "Integration-only rebake rejected Guest-affecting change: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$base_commit" HEAD)
          git show "$base_commit:sources.env" | sed '/^RIFTVM_GUEST_AGENT_REF=/d' >build/base-sources.env
          sed '/^RIFTVM_GUEST_AGENT_REF=/d' sources.env >build/current-sources.env
          cmp build/base-sources.env build/current-sources.env || {
            echo 'A pinned input other than RIFTVM_GUEST_AGENT_REF changed.' >&2
            exit 1
          }
          provenance=build/base-release/image-provenance.txt
          grep -qxF "omarchy_source_ref=$OMARCHY_REF" "$provenance"
          grep -qxF "riftvm_wl_copy_source_ref=$WL_COPY_REF" "$provenance"
          rm -f -- build/base-sources.env build/current-sources.env

      - name: Build and verify the sparse raw image
        env:
          OMARCHY_IMAGE_LOW_DISK: '1'
          USE_REBAKE: ${{ steps.base.outputs.use_rebake }}
          BASE_IMAGE_SHA256: ${{ steps.base.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ "$USE_REBAKE" == true ]]; then
            legacy_args=()
            if [[ '${{ steps.base.outputs.legacy }}' == true ]]; then legacy_args=(--legacy-ezvm32); fi
            ./bin/rebake-riftvm-integration-container "${legacy_args[@]}" \
              --base-image build/base.raw \
              --base-sha256 "$BASE_IMAGE_SHA256" \
              --output build/omarchy-aarch64-riftvm.raw \
              --riftvm-guest-agent build/dependencies/rift-agent/rift-agent \
              --rift-session-agent-unit build/dependencies/riftvm/GuestAgent/linux/rift-session-agent.service \
              --agent-source-url '${{ steps.sources.outputs.riftvm_agent_url }}' \
              --agent-source-ref '${{ steps.sources.outputs.riftvm_agent_ref }}' \
              --expected-omarchy-ref '${{ steps.sources.outputs.omarchy_ref }}' \
              --expected-wl-copy-ref '${{ steps.sources.outputs.wl_clipboard_rs_ref }}' \
              --force
            rm -f -- build/base.raw
            find build/base-release -depth -delete
          else
            ./bin/build-image-container \
              --omarchy-source build/dependencies/omarchy-aarch64 \
              --riftvm-guest-agent build/dependencies/rift-agent/rift-agent \
              --riftvm-wl-copy build/dependencies/rift-agent/wl-copy \
              --force
          fi
          (cd build && sha256sum --check omarchy-aarch64-riftvm.raw.sha256)
          df -h /

      # Save before packaging/upload so a later Release API failure does not
      # discard the already verified rootfs and Node.js inputs.
      - name: Save verified rolling inputs
        if: steps.base.outputs.use_rebake != 'true' && steps.input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/cache/ArchLinuxARM-aarch64-latest.tar.gz
            build/cache/ArchLinuxARM-aarch64-latest.tar.gz.sig
            build/cache/archlinuxarm.gpg
            build/cache/archlinuxarm-rootfs-*.gpg
            build/cache/node-SHASUMS256.txt
            build/cache/node-v*-linux-arm64.tar.gz
          key: image-inputs-${{ runner.arch }}-${{ hashFiles('sources.env') }}-${{ steps.sources.outputs.cache_week }}

      - name: Package split RiftVM release assets
        run: |
          set -euo pipefail
          ./bin/package-riftvm-release \
            --tag '${{ steps.release.outputs.tag }}' \
            --output build/release-assets
          find build/release-assets -maxdepth 1 -type f -size +2047M -print -quit |
            grep -q . && {
              echo 'A release asset exceeds GitHub’s 2 GiB limit.' >&2
              exit 1
            }
          (cd build/release-assets && sha256sum --check SHA256SUMS)

      - name: Create and verify draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir=build/release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          mapfile -t assets < <(find "$release_dir" -mindepth 1 -maxdepth 1 -type f -print | sort)
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Omarchy AArch64 VM for RiftVM $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ $release_id =~ ^[0-9]+$ ]]
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          while read -r checksum name; do
            remote_digest=$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json")
            [[ $remote_digest == "sha256:$checksum" ]] || {
              echo "Uploaded asset digest mismatch: $name" >&2
              exit 1
            }
          done < <(cd "$release_dir" && sha256sum *)

      - name: Report factory signing handoff
        run: |
          echo "Raw image draft verified. The release remains a draft."
          echo "Next: verify ASIF against the raw image, sign and upload the factory manifest/parts on macOS, and complete native acceptance before publication."
