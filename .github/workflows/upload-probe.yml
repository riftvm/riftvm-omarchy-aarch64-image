name: Upload probe

# Temporary diagnostic: measures how fast this repository's release-asset upload
# endpoint accepts a 128 MiB asset from a hosted ARM runner. Used to decide when
# a stalled image release can be re-dispatched. Delete after the v4.0.3-riftvm.9
# release is published.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.repository == 'riftvm/riftvm-omarchy-aarch64-image'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Create payload
        run: |
          set -euo pipefail
          dd if=/dev/urandom of=payload.bin bs=1M count=128 status=none
          ls -l payload.bin

      - name: Probe release asset upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=probe-upload-${{ github.run_id }}
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Upload probe" --notes "Temporary probe; the run deletes it."
          start=$(date +%s)
          if timeout 300 gh release upload "$tag" --repo "$GITHUB_REPOSITORY" payload.bin; then
            echo "PROBE-RESULT release-asset: $(( $(date +%s) - start ))s for 128 MiB"
          else
            echo "PROBE-RESULT release-asset: TIMEOUT after $(( $(date +%s) - start ))s for 128 MiB"
          fi
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Probe artifact upload
        id: artifact
        run: |
          set -euo pipefail
          start=$(date +%s)
          echo "start=$start" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: probe-payload
          path: payload.bin
          compression-level: 0
          retention-days: 1

      - name: Report artifact result
        run: |
          set -euo pipefail
          echo "PROBE-RESULT artifact: finished at $(date -u +%H:%M:%S) (step timings show the duration)"
